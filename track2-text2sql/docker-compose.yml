services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: text2sql
      POSTGRES_USER: text2sql
      POSTGRES_PASSWORD: text2sql
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./data/demo/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/demo/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U text2sql -d text2sql"]
      interval: 2s
      timeout: 2s
      retries: 20

