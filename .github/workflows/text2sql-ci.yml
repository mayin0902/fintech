name: text2sql-ci

on:
  push:
    paths:
      - "track2-text2sql/**"
      - ".github/workflows/text2sql-ci.yml"
  pull_request:
    paths:
      - "track2-text2sql/**"
      - ".github/workflows/text2sql-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: track2-text2sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

